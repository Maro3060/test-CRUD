<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD</title>
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="w-50 mx-auto p-5">
      <h1 class="text-center mb-4">Product Management</h1>
      <form>
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="product-name"
            placeholder="Enter your product name"
          />
          <label for="product-name">Product Name</label>
        </div>
        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="product-price"
            placeholder="Enter your product Price"
          />
          <label for="product-price">Product Price</label>
        </div>
        <div class="form-floating mb-3">
          <input
            type="search"
            class="form-control"
            id="product-category"
            placeholder="Enter your product Price"
            list="category"
          />
          <label for="product-category">Product Category</label>
          <datalist id="category">
            <option value="TV"></option>
            <option value="Mobile"></option>
            <option value="Iphone"></option>
            <option value="Smart Wtch"></option>
            <option value="Play station"></option>
            <option value="Lab top"></option>
          </datalist>
        </div>
        <div class="form-floating mb-3">
          <input
            type="file"
            class="form-control"
            id="product-image"
            placeholder="Enter your product image"
          />
          <label for="product-price">Product Image</label>
        </div>
        <div class="form-floating mb-3">
          <textarea
            class="form-control"
            name=""
            id="product-discription"
            style="resize: none;"
          ></textarea>
          <label for="product-discription">Discription</label>
        </div>
        <button class="btn btn-primary w-100 py-3">Add Product</button>
      </form>
    </main>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
