<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD</title>
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="w-50 mx-auto p-5">
      <h1 class="text-center mb-4">Product Management</h1>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control "
          id="productName"
          placeholder="Enter your product name"
          oninput="validateInput(this)"
        />
        <span class="text-danger d-none">Product names must start with capital letter and only contain letters, numbers, and spaces</span>
        <label for="productName">Product Name</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="productPrice"
          placeholder="Enter your product Price"
          oninput="validateInput(this)"
        />
        <span class="text-danger d-none">The minimum price for this product is $500</span>
        <label for="productPrice">Product Price</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="search"
          class="form-control"
          id="productCategory"
          placeholder="Enter your product Price"
          list="cate"
          oninput="validateInput(this)"
        />
        <span class="text-danger d-none">you must choose from list</span>
        <label for="productCategory">Product Category</label>
        <datalist id="cate">
          <option value="TV"></option>
          <option value="Mobile"></option>
          <option value="Iphone"></option>
          <option value="Watches"></option>
          <option value="Playstation"></option>
          <option value="Labtop"></option>
        </datalist>
      </div>
      <div class="form-floating mb-3">
        <input
          type="file"
          class="form-control"
          id="product-image"
          placeholder="Enter your product image"
        />
        <label for="product-price">Product Image</label>
      </div>
      <div class="form-floating mb-3">
        <textarea
          class="form-control"
          name=""
          id="productDiscription"
          style="resize: none"
          oninput="validateInput(this)"
        ></textarea>
        <label for="productDiscription">Discription</label>
      </div>
      <button
        class="btn btn-primary w-100 py-3"
        onclick="addProduct()"
        id="addBtn"
      >
        Add Product
      </button>
      <button
        class="btn btn-info w-100 py-3 d-none"
        id="updateBtn"
        onclick="updateProduct()"
      >
        update Product
      </button>
    </main>
    <section class="my-5">
      <div class="container">
        <div class="form-floating mb-5">
          <input
            type="text"
            class="form-control"
            id="search-product"
            placeholder="Search for product"
            oninput="searchProduct()"
          />
          <label for="product-name">Search</label>
        </div>
        <div class="row gy-4" id="products-area"></div>
      </div>
    </section>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
